name: retailpulse
version: "1.0.0"
config-version: 2
profile: retailpulse
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]
models:
  retailpulse:
    staging:
      +materialized: ephemeral
    marts:
      +materialized: table
      +file_format: iceberg
      dimensions:
        +schema: analytics
      facts:
        +schema: analytics
      business:
        +schema: analytics
