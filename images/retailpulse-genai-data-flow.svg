<text x="60" y="1145" class="subtitle">Embeddings: Ollama / nomic-embed-text. Customer answers use Ollama / Qwen3 unless a stored-ranking shortcut applies.</text><text x="60" y="1178" class="subtitle">Analytics returns SQL, columns, rows and row_count, or an unsupported reason. Product sales by date are outside the approved view.</text><text x="60" y="1211" class="subtitle">SHAP explanations are precomputed. Memory stores user and assistant messages. Arrows show the main information paths.</text><text x="60" y="1244" class="subtitle">Source implementation diagram. Analytics runtime verification remains pending after reporting-view setup or permission errors.</text></svg>
