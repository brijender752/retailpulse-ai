x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 3 task processes use this service to report task state. Do not
    # use localhost: from a scheduler/task container it is not the API server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__API__SECRET_KEY: retailpulse-local-dev-secret
    # These must be identical in the scheduler, task runner, and API server.
    # Otherwise Airflow 3 task runners cannot authenticate to /execution/ and
    # fail immediately after the "Pre Execute" log entry.
    AIRFLOW__API_AUTH__JWT_SECRET: retailpulse-local-dev-execution-jwt-secret
    AIRFLOW__API_AUTH__JWT_ISSUER: retailpulse-airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    RETAILPULSE_POSTGRES_HOST: ${RETAILPULSE_POSTGRES_HOST:-postgres}
    RETAILPULSE_POSTGRES_PORT: ${RETAILPULSE_POSTGRES_PORT:-5432}
    RETAILPULSE_POSTGRES_DB: ${RETAILPULSE_POSTGRES_DB:-retailpulse}
    RETAILPULSE_POSTGRES_USER: ${RETAILPULSE_POSTGRES_USER:-retailpulse}
    RETAILPULSE_POSTGRES_PASSWORD: ${RETAILPULSE_POSTGRES_PASSWORD:-retailpulse}

    RETAILPULSE_DEBEZIUM_URL: ${RETAILPULSE_DEBEZIUM_URL:-http://debezium:8083}
    RETAILPULSE_DEBEZIUM_CONNECTOR: ${RETAILPULSE_DEBEZIUM_CONNECTOR:-retailpulse-postgres-connector}

    RETAILPULSE_KAFKA_HOST: ${RETAILPULSE_KAFKA_HOST:-kafka}
    RETAILPULSE_KAFKA_PORT: ${RETAILPULSE_KAFKA_PORT:-9092}

    RETAILPULSE_FLINK_URL: ${RETAILPULSE_FLINK_URL:-http://flink-jobmanager:8081}
    RETAILPULSE_FLINK_CONTAINER: ${RETAILPULSE_FLINK_CONTAINER:-retailpulse-flink-jobmanager}

    RETAILPULSE_MINIO_ENDPOINT: ${RETAILPULSE_MINIO_ENDPOINT:-minio:9000}
    RETAILPULSE_MINIO_ACCESS_KEY: ${RETAILPULSE_MINIO_ACCESS_KEY:-minioadmin}
    RETAILPULSE_MINIO_SECRET_KEY: ${RETAILPULSE_MINIO_SECRET_KEY:-minioadmin}
    RETAILPULSE_MINIO_SECURE: ${RETAILPULSE_MINIO_SECURE:-false}
    RETAILPULSE_MINIO_BUCKET: ${RETAILPULSE_MINIO_BUCKET:-retailpulse}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./:/opt/retailpulse:ro
    - ./airflow/logs:/opt/airflow/logs

    # Local-development control plane:
    # lets Airflow submit/check PyFlink jobs inside the existing JobManager.
    - /var/run/docker.sock:/var/run/docker.sock

  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow-internal
    - retailpulse

  depends_on:
    airflow-db:
      condition: service_healthy



services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16
    container_name: retailpulse-postgres
    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - retailpulse

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # MinIO
  # ==========================================================

  minio:
    image: minio/minio:latest
    container_name: retailpulse-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

    volumes:
      - minio_data:/data
    networks:
      - retailpulse  

  # ==========================================================
  # Kafka
  # ==========================================================

  kafka:
    image: apache/kafka:4.0.1
    container_name: retailpulse-kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094

      # Containers use Kafka's Compose hostname; local Python clients use localhost.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - retailpulse


  # Create every CDC topic before Flink subscribes to it.  Debezium only
  # creates a topic after it produces a record, while Flink subscribes to all
  # configured tables immediately.
  kafka-topic-init:
    image: apache/kafka:4.0.1
    container_name: retailpulse-kafka-topic-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /bin/sh
      - -ec
      - |
        for topic in customers products orders order_items payments inventory website_events support_tickets marketing_events; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "retailpulse.ecommerce.$${topic}" \
            --partitions 3 \
            --replication-factor 1
        done

    networks:
      - retailpulse


  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: retailpulse-kafka-ui

    ports:
      - "8080:8080"

    depends_on:
      - kafka

    environment:
      KAFKA_CLUSTERS_0_NAME: retailpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    networks:
      - retailpulse

  # ==========================================================
  # Debezium Kafka Connect
  # ==========================================================

  debezium:
    image: quay.io/debezium/connect:3.3.2.Final
    container_name: retailpulse-debezium
    restart: unless-stopped

    depends_on:
      - kafka
      - postgres

    ports:
      - "8083:8083"

    environment:

      # ------------------------------------------------------
      # Kafka
      # ------------------------------------------------------

      BOOTSTRAP_SERVERS: kafka:9092

      GROUP_ID: 1

      # ------------------------------------------------------
      # Kafka Connect internal topics
      # ------------------------------------------------------

      CONFIG_STORAGE_TOPIC: debezium_connect_configs

      OFFSET_STORAGE_TOPIC: debezium_connect_offsets

      STATUS_STORAGE_TOPIC: debezium_connect_status

      # ------------------------------------------------------
      # Replication
      # ------------------------------------------------------

      CONFIG_STORAGE_REPLICATION_FACTOR: 1

      OFFSET_STORAGE_REPLICATION_FACTOR: 1

      STATUS_STORAGE_REPLICATION_FACTOR: 1

      # ------------------------------------------------------
      # Converters
      # ------------------------------------------------------

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"

      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # ------------------------------------------------------
      # REST
      # ------------------------------------------------------

      REST_PORT: 8083

      REST_ADVERTISED_HOST_NAME: debezium

    networks:
      - retailpulse


  # Registers the PostgreSQL CDC connector after Kafka Connect is ready.
  # Kafka Connect does not automatically load JSON files from the project.
  debezium-init:
    image: curlimages/curl:8.12.1
    container_name: retailpulse-debezium-init
    restart: "no"

    depends_on:
      debezium:
        condition: service_started

    volumes:
      - ./ingestion/debezium/postgres-connector.json:/connector/postgres-connector.json:ro

    command:
      - /bin/sh
      - -ec
      - |
        until curl --fail --silent http://debezium:8083/connectors > /dev/null; do
          echo "Waiting for Debezium Kafka Connect..."
          sleep 2
        done

        if curl --fail --silent http://debezium:8083/connectors/retailpulse-postgres-connector > /dev/null; then
          echo "PostgreSQL connector already registered."
        else
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @/connector/postgres-connector.json \
            http://debezium:8083/connectors
          echo "PostgreSQL connector registered."
        fi

    networks:
      - retailpulse


  # ==========================================================
  # Apache Flink JobManager
  # ==========================================================

  # Named Docker volumes are initially owned by root. Flink runs as the
  # unprivileged `flink` user, so prepare the shared checkpoint directory
  # before either Flink service starts.
  flink-checkpoint-init:
    image: alpine:3.21
    container_name: retailpulse-flink-checkpoint-init
    restart: "no"

    command:
      - sh
      - -ec
      - mkdir -p /tmp/flink-checkpoints && chmod 0777 /tmp/flink-checkpoints

    volumes:
      - flink_checkpoints:/tmp/flink-checkpoints

  flink-jobmanager:
    build:
      context: ./flink
    container_name: retailpulse-flink-jobmanager
    user: flink
    restart: unless-stopped

    command: jobmanager

    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully

    ports:
      - "8081:8081"

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///tmp/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: retailpulse

    networks:
      - retailpulse

    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints:/tmp/flink-checkpoints


  # ==========================================================
  # Apache Flink TaskManager
  # ==========================================================

  flink-taskmanager:
    build:
      context: ./flink
    container_name: retailpulse-flink-taskmanager
    user: flink
    restart: unless-stopped

    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started

    command: taskmanager

    environment:
      # Six concurrent CDC jobs share this heap, including Kafka fetch buffers.
      # A 512 MB task heap exhausts during the initial source replay.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 10
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.task.heap.size: 2048m
        taskmanager.memory.task.off-heap.size: 512m
        taskmanager.memory.framework.off-heap.size: 128m
        taskmanager.memory.network.min: 128m
        taskmanager.memory.network.max: 128m
        taskmanager.memory.managed.size: 128m
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///tmp/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: retailpulse

    networks:
      - retailpulse

    volumes:
      - ./flink/jobs:/opt/flink/jobs
      - flink_checkpoints:/tmp/flink-checkpoints   

  spark:
    image: apache/spark:4.0.1

    container_name: retailpulse-spark

    hostname: spark

    user: root

    command:
      - /bin/bash
      - -c
      - |
        tail -f /dev/null

    volumes:
      - ./:/opt/retailpulse

    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    networks:
      - retailpulse

    depends_on:
      - minio
  

  spark-iceberg:
    build:
      context: .
      dockerfile: spark/iceberg/Dockerfile
    container_name: retailpulse-spark-iceberg
    hostname: spark-iceberg
    user: root
    command: ["bash", "-lc", "tail -f /dev/null"]
    volumes:
      - ./:/opt/retailpulse
      - spark-iceberg-ivy:/root/.ivy2
    environment:
      ICEBERG_VERSION: "1.11.0"
      HADOOP_AWS_PACKAGE: "org.apache.hadoop:hadoop-aws:3.4.1"
      MINIO_S3A_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      ICEBERG_WAREHOUSE: "s3a://retailpulse/warehouse"
    networks:
      - retailpulse
    depends_on:
      - minio

  spark-thrift:
    build:
      context: .
      dockerfile: spark/iceberg/Dockerfile
    container_name: retailpulse-spark-thrift
    hostname: spark-thrift
    user: root
    ports: ["10000:10000"]
    volumes:
      - ./:/opt/retailpulse
      - spark-iceberg-ivy:/root/.ivy2
    command:
      - bash
      - -lc
      - |
        set -e
        /opt/spark/bin/spark-submit /opt/retailpulse/lakehouse/iceberg/jobs/init_dbt_namespaces.py
        /opt/spark/sbin/start-thriftserver.sh \
          --master local[*] \
          --hiveconf hive.server2.thrift.port=10000 \
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
          --conf spark.sql.catalog.retailpulse=org.apache.iceberg.spark.SparkCatalog \
          --conf spark.sql.catalog.retailpulse.type=hadoop \
          --conf spark.sql.catalog.retailpulse.warehouse=s3a://retailpulse/warehouse \
          --conf spark.sql.defaultCatalog=retailpulse \
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
          --conf spark.hadoop.fs.s3a.access.key=minioadmin \
          --conf spark.hadoop.fs.s3a.secret.key=minioadmin \
          --conf spark.hadoop.fs.s3a.path.style.access=true \
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
          --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        sleep 5
        tail -F /opt/spark/logs/*
    networks: [retailpulse]
    depends_on: [minio]

  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    container_name: retailpulse-dbt
    hostname: dbt
    command: ["bash","-lc","tail -f /dev/null"]
    volumes:
      - ./dbt:/opt/retailpulse/dbt
    environment:
      DBT_PROFILES_DIR: /opt/retailpulse/dbt
    networks: [retailpulse]
    depends_on: [spark-thrift]

    
  quality:
    build:
      context: .
      dockerfile: quality/Dockerfile
    container_name: retailpulse-quality
    hostname: quality
    user: root
    command: ["bash","-lc","tail -f /dev/null"]
    volumes:
      - ./:/opt/retailpulse
      - spark-iceberg-ivy:/root/.ivy2
    environment:
      ICEBERG_VERSION: "1.11.0"
      HADOOP_AWS_PACKAGE: "org.apache.hadoop:hadoop-aws:3.4.1"
      MINIO_S3A_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      ICEBERG_WAREHOUSE: "s3a://retailpulse/warehouse"
    networks:
      - retailpulse
    depends_on:
      - minio
      - spark-thrift


  superset-db:
    image: postgres:16
    container_name: retailpulse-superset-db
    hostname: superset-db
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks: [retailpulse]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER:-superset} -d ${SUPERSET_DB_NAME:-superset}"]
      interval: 10s
      timeout: 5s
      retries: 10

  superset-redis:
    image: redis:7-alpine
    container_name: retailpulse-superset-redis
    hostname: superset-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - superset-redis-data:/data
    networks: [retailpulse]

  superset-init:
    build:
      context: .
      dockerfile: superset/Dockerfile
    container_name: retailpulse-superset-init
    env_file:
      - ./.env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DB_HOST: superset-db
      SUPERSET_DB_PORT: "5432"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/init_superset.sh:/app/init_superset.sh:ro
    command: ["bash", "/app/init_superset.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_started
    networks: [retailpulse]

  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    container_name: retailpulse-superset
    hostname: superset
    env_file:
      - ./.env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DB_HOST: superset-db
      SUPERSET_DB_PORT: "5432"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8088
      - --workers
      - "2"
      - --worker-class
      - gevent
      - --timeout
      - "120"
      - "superset.app:create_app()"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks: [retailpulse]

  airflow-db:
    container_name: airflow-airflow-db-1
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - airflow-internal

  airflow-init:
    container_name: airflow-airflow-init-1
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-airflow-apiserver-1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-airflow-scheduler-1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-airflow-dag-processor-1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-airflow-triggerer-1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    restart: unless-stopped


networks:
  airflow-internal:
    driver: bridge
  retailpulse:
    driver: bridge
    name: retailpulse-ai_retailpulse
    
    
# ============================================================
# Volumes
# ============================================================

volumes:

  postgres_data:

  minio_data:
  kafka_data:
  flink_checkpoints:
  spark-iceberg-ivy:
  superset-db-data:
  superset-redis-data:

  airflow-db-data:
    name: airflow_airflow-db-data
