global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: retailpulse-metrics
    static_configs:
      - targets: ["retailpulse-metrics:9105"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: debezium-jmx
    static_configs:
      - targets: ["debezium:7071"]

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["flink-taskmanager:9249"]

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["retailpulse-api:8000"]

  - job_name: minio
    metrics_path: /minio/metrics/v3
    bearer_token_file: /etc/prometheus/secrets/minio_token
    static_configs:
      - targets: ["minio:9000"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
