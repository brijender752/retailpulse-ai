<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc"><title id="title">RetailPulse AI monitoring coverage</title><desc id="desc">Planned metrics and collection methods across fifteen services. Exporters feed Prometheus and Grafana.</desc><rect width="1500" height="1260" fill="#0b1220"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="65" font-size="34" font-weight="700" fill="#f8fafc">RetailPulse AI | Monitoring coverage</text><text x="48" y="105" font-size="19" fill="#94a3b8">Data pipeline / Analytics / Machine learning / API / GenAI</text><rect x="48" y="135" width="1404" height="62" rx="12" fill="#163044" stroke="#22d3ee"/><text x="750" y="174" text-anchor="middle" font-size="23" fill="#e0f2fe">Services + checks  →  Exporters / metrics endpoints  →  Prometheus  →  Grafana</text><rect x="48" y="225" width="1404" height="50" rx="8" fill="#1e293b"/>
